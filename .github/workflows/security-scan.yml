name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --only main
          poetry run python -m pip freeze | grep -v '^-e ' > runtime-requirements.txt

      - name: Run runtime dependency audit
        run: |
          pip install pip-audit
          pip-audit -r runtime-requirements.txt

      - name: Run static security scan
        run: |
          pip install bandit
          bandit -r pycleancode
